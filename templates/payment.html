{% extends "base.html" %}

{% block content %}

<div style="text-align:center; margin-bottom:2rem;">
    <h2 style="color:#00c853;">💳 Secure UPI Payment</h2>
    <p style="color:var(--text-light);">
        SOC Emergency Incident Support
    </p>
</div>

<div style="text-align:center; margin-bottom:2rem;">
    <h3>Amount: ₹{{ amount }}</h3>
</div>

<div style="text-align:center; margin-bottom:2rem;">
    <img src="{{ url_for('static', filename=qr_image) }}"
         width="220"
         style="border:2px solid var(--border-color); padding:10px; border-radius:10px;">
</div>

<div style="text-align:center; margin-bottom:1rem;">
    <p><strong>UPI ID:</strong> {{ upi_id }}</p>
</div>

<div style="text-align:center;">
    <a href="{{ url_for('legal_support') }}"
       style="background-color:#dc3545; color:white; padding:12px 25px;
              border-radius:8px; text-decoration:none; font-weight:bold;">
        ✅ I Have Paid – Join SOC Call
    </a>
</div>

{% endblock %}
