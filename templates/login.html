{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="card animate__animated animate__fadeInUp" style="max-width: 400px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 style="color: var(--text-primary); margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: var(--text-light);">Sign in to your secure account</p>
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                <i class="fas fa-sign-in-alt"></i>
                Sign In
            </button>
        </form>
        
        <div style="text-align: center;">
            <p style="color: var(--text-light);">
                Don't have an account? 
                <a href="{{ url_for('signup') }}" style="color: var(--primary-color); text-decoration: none;">
                    Sign up here
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
